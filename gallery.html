<script>
/* ===========================
   TBfotography Gallery.js
=========================== */

// ===========================
// FILTER
// ===========================

const filterButtons = document.querySelectorAll(".filters button");
const galleryItems = document.querySelectorAll(".gallery-item");

filterButtons.forEach(button=>{

    button.addEventListener("click",()=>{

        filterButtons.forEach(btn=>btn.classList.remove("active"));

        button.classList.add("active");

        const filter = button.dataset.filter;

        galleryItems.forEach(item=>{

            if(filter === "all"){

                item.style.display = "block";

            }

            else if(item.classList.contains(filter)){

                item.style.display = "block";

            }

            else{

                item.style.display = "none";

            }

        });

    });

});

// ===========================
// LIGHTBOX
// ===========================

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const closeBtn = document.querySelector(".close");

let currentIndex = 0;
let visibleImages = [];

function updateVisibleImages(){

    visibleImages = Array.from(document.querySelectorAll(".gallery-item"))
        .filter(item => item.style.display !== "none");

}

updateVisibleImages();

galleryItems.forEach(item=>{

    item.addEventListener("click",()=>{

        updateVisibleImages();

        currentIndex = visibleImages.indexOf(item);

        lightboxImg.src = item.querySelector("img").src;

        lightbox.classList.add("show");

    });

});

// ===========================
// CLOSE
// ===========================

closeBtn.onclick = ()=>{

    lightbox.classList.remove("show");

};

lightbox.onclick = (e)=>{

    if(e.target === lightbox){

        lightbox.classList.remove("show");

    }

};

// ===========================
// KEYBOARD
// ===========================

document.addEventListener("keydown",(e)=>{

    if(!lightbox.classList.contains("show")) return;

    if(e.key === "Escape"){

        lightbox.classList.remove("show");

    }

    if(e.key === "ArrowRight"){

        currentIndex++;

        if(currentIndex >= visibleImages.length){

            currentIndex = 0;

        }

        lightboxImg.src =
        visibleImages[currentIndex].querySelector("img").src;

    }

    if(e.key === "ArrowLeft"){

        currentIndex--;

        if(currentIndex < 0){

            currentIndex = visibleImages.length - 1;

        }

        lightboxImg.src =
        visibleImages[currentIndex].querySelector("img").src;

    }

});

// Burger
const menuBtn = document.getElementById("menuBtn");

const mobileMenu = document.getElementById("mobileMenu");

menuBtn.addEventListener("click",()=>{

    menuBtn.classList.toggle("active");

    mobileMenu.classList.toggle("show");

});


// Close when a link is clicked

document.querySelectorAll(".mobile-menu a").forEach(link=>{

    link.addEventListener("click",()=>{

        menuBtn.classList.remove("active");

        mobileMenu.classList.remove("show");

    });

});


// Close when clicking outside the menu links

mobileMenu.addEventListener("click",(e)=>{

    if(e.target === mobileMenu){

        menuBtn.classList.remove("active");

        mobileMenu.classList.remove("show");

    }

});
</script>
